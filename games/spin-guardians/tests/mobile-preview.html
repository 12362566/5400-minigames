<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>旋刃守卫 · 手机布局检验</title><style>:root{color-scheme:only light}*{box-sizing:border-box}body{margin:0;padding:20px;font:14px system-ui,sans-serif;color:#203b34;background:#e5e7dc}h1{font-size:20px;margin:0 0 8px}p{max-width:680px;font-size:12px;line-height:1.8;color:#68786b}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{min-height:44px;padding:10px 15px;border:1px solid #a2b292;border-radius:8px;background:#f6f6e8;color:#355142;cursor:pointer}button[aria-pressed=true]{background:#285941;color:white}.device{display:inline-block;padding:8px;background:#1c2b25;border-radius:22px;box-shadow:0 15px 30px #17251f22}iframe{display:block;width:390px;height:844px;border:0;border-radius:14px;background:#f5f4e9}#status{font-weight:700;font-size:12px}a{color:#285941}</style></head><body><h1>手机真实 CSS 视口检验</h1><p>内嵌的是正式游戏页面，使用浏览器原生窄视口运行同一份 CSS 和交互。这能验证响应式布局；它不模拟触屏硬件、刘海安全区、浏览器地址栏或设备性能。存档使用当前浏览器的本机存储。</p><div class="controls"><button data-size="390,844" aria-pressed="true">390 × 844</button><button data-size="320,568" aria-pressed="false">320 × 568</button><button data-size="410,820" aria-pressed="false">410 × 820</button><button data-size="430,932" aria-pressed="false">430 × 932</button><button data-size="760,844" aria-pressed="false">760 × 844</button><button data-size="900,844" aria-pressed="false">900 × 844</button></div><p id="status">游戏视口：390 × 844 CSS px</p><pre id="diagnostics" aria-live="polite" style="white-space:pre-wrap;font-size:12px;line-height:1.5">正在检查真实布局…</pre><button id="recheck">重新检查布局</button><div class="device"><iframe id="game" title="旋刃守卫手机视口" src="../index.html?mobile-qa=1.2"></iframe></div><p><a href="../index.html">打开正式游戏 ↗</a> · <a href="../../../index.html">返回小游戏合集</a></p><script>
const frame=document.getElementById('game');
const diagnostics=document.getElementById('diagnostics');
function inspectLayout(){
  try {
    const w=frame.contentWindow,d=frame.contentDocument;
    const grid=d.querySelector('.game-layout'),battle=d.querySelector('.battle-column'),commands=d.querySelector('.command-column'),canvas=d.getElementById('board');
    if(!grid||!battle||!commands||!canvas)throw new Error('游戏仍在加载');
    const gr=w.getComputedStyle(grid),br=battle.getBoundingClientRect(),cr=commands.getBoundingClientRect(),cv=canvas.getBoundingClientRect();
    const mobile=w.innerWidth<=760;
    const tracks=gr.gridTemplateColumns.trim().split(/\s+/).length;
    const checks=[
      ['视口与预设尺寸一致',w.innerWidth===parseInt(frame.style.width||390)&&w.innerHeight===parseInt(frame.style.height||844)],
      ['无横向溢出',d.documentElement.scrollWidth<=w.innerWidth],
      ['画布保持 9:11 比例',cv.width>0&&cv.height>0&&Math.abs(cv.width/cv.height-9/11)<.015],
      ['画布处于视口横向范围',cv.left>=-1&&cv.right<=w.innerWidth+1]
    ];
    if(mobile)checks.push(['移动端单列网格',tracks===1],['战场在操作区上方',br.bottom<=cr.top+1],['操作区底部在视口内',cr.bottom<=w.innerHeight+1],['画布不进入操作区',cv.bottom<=cr.top+1]);
    else checks.push(['桌面双列网格',tracks===2]);
    diagnostics.textContent=(checks.every(c=>c[1])?'PASS':'FAIL')+' · 真实浏览器布局检查\n'+
      `视口 ${w.innerWidth}×${w.innerHeight}；网格列 ${gr.gridTemplateColumns}\n`+
      `战场 top/bottom ${br.top.toFixed(1)}/${br.bottom.toFixed(1)}；操作区 ${cr.top.toFixed(1)}/${cr.bottom.toFixed(1)}\n`+
      `画布 ${cv.width.toFixed(1)}×${cv.height.toFixed(1)}；文档宽 ${d.documentElement.scrollWidth}\n`+
      checks.map(([name,ok])=>(ok?'PASS':'FAIL')+' '+name).join('\n');
  }catch(error){diagnostics.textContent='等待检查：'+error.message}
}
function scheduleCheck(){requestAnimationFrame(()=>requestAnimationFrame(inspectLayout))}
frame.addEventListener('load',scheduleCheck);
document.getElementById('recheck').onclick=scheduleCheck;
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{
 const [w,h]=button.dataset.size.split(',').map(Number);
 frame.style.width=w+'px';frame.style.height=h+'px';
 document.getElementById('status').textContent=`游戏视口：${w} × ${h} CSS px`;
 document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 scheduleCheck();
});
</script></body></html>
