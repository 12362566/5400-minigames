<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WebGL capability check</title><style>body{font:16px system-ui;background:#fff7e8;color:#292a30;padding:24px}pre{white-space:pre-wrap}canvas{border:1px solid #ccc;margin:8px}</style><h1>标准 WebGL 能力检查</h1><p>仅申请标准图形上下文，不修改浏览器设置。绿色方块代表上下文已建立并完成清屏。</p><div id="samples"></div><pre id="report">Checking…</pre><script>
const rows=[];for(const kind of ['webgl2','webgl','experimental-webgl']){const canvas=document.createElement('canvas');canvas.width=80;canvas.height=80;canvas.setAttribute('aria-label',kind+' context');document.getElementById('samples').append(canvas);let error=null;canvas.addEventListener('webglcontextcreationerror',e=>error=e.statusMessage);try{const gl=canvas.getContext(kind,{failIfMajorPerformanceCaveat:false});if(gl){gl.clearColor(.1,.7,.3,1);gl.clear(gl.COLOR_BUFFER_BIT);}rows.push({kind,supported:!!gl,error,version:gl?.getParameter(gl.VERSION)||null});}catch(e){rows.push({kind,supported:false,error:String(e)});}}document.getElementById('report').textContent=JSON.stringify({webglConstructor:typeof WebGLRenderingContext,webgl2Constructor:typeof WebGL2RenderingContext,checks:rows},null,2);
</script></html>
