<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Salvo viewport QA</title><style>body{margin:0;background:#e2ded5;font:13px system-ui;color:#2a2a29}header{position:sticky;top:0;z-index:2;padding:10px 16px;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:8px 12px;border:1px solid #ddd;border-radius:6px;cursor:pointer}#fixture{padding:15px;display:flex;justify-content:center;align-items:flex-start}iframe{border:0;flex:none;box-shadow:0 12px 45px #0002}pre{margin:10px auto;max-width:950px;padding:14px;background:#fff;white-space:pre-wrap;border-radius:10px}#size{font-weight:bold}.ok{color:#167744}.fail{color:#b63030}</style><header><span id="size"></span><button data-size="320,568">320×568</button><button data-size="390,844">390×844</button><button data-size="410,820">410×820</button><button data-size="844,390">844×390</button><button data-size="568,320">568×320</button><button data-size="1280,900">1280×900</button><button id="run">运行交互检查</button><button id="fit">缩放预览</button><select id="scene" aria-label="预览关卡"></select><button id="win">通关预览</button><button id="lose">失败预览</button></header><div id="fixture"><iframe id="game" title="实际游戏同源尺寸测试"></iframe></div><pre id="report">Loading…</pre><script>
const params=new URLSearchParams(location.search),w=+(params.get('w')||390),h=+(params.get('h')||844),game=document.getElementById('game'),report=document.getElementById('report');
game.width=w;game.height=h;game.style.width=w+'px';game.style.height=h+'px';game.src='../index.html?qa=1&v=1.0.1';document.getElementById('size').textContent=w+' × '+h;
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const[a,z]=b.dataset.size.split(',');location.search='?w='+a+'&h='+z};
let fitted=false;document.getElementById('fit').onclick=()=>{fitted=!fitted;const scale=Math.min(1,(innerHeight-95)/h,(innerWidth-30)/w);game.style.transform=fitted?'scale('+scale+')':'';game.style.transformOrigin='top center';document.getElementById('fixture').style.height=fitted?h*scale+'px':'';};
const wait=ms=>new Promise(r=>setTimeout(r,ms));let assertions=[];
function solve(api,index,threshold=1){const s=api.createGame(index),colors=['green','pink','cyan','ink'];let step=0;while(s.status==='playing'&&s.hits/s.total<threshold&&step++<3000){const targets=api.exposedTargets(s);for(const c of colors){if(s.slots.filter(Boolean).length>=5)break;if(!s.slots.some(v=>v?.color===c)&&targets.some(v=>v.color===c)&&s.queues[colors.indexOf(c)].length)api.deploy(s,colors.indexOf(c));}api.tick(s,.5);}return s;}
document.getElementById('scene').onchange=e=>{const a=game.contentWindow.cubeSalvoQA;a.load(a.createGame(+e.target.value));};
document.getElementById('win').onclick=()=>{const a=game.contentWindow.cubeSalvoQA;a.load(solve(a,+document.getElementById('scene').value));};
document.getElementById('lose').onclick=()=>{const a=game.contentWindow.cubeSalvoQA,s=a.createGame(6);for(let i=0;i<5;i++)a.deploy(s,0);a.tick(s,100);a.load(s);};
function check(name,ok,details=''){assertions.push({name,passed:!!ok,details});}
function geometry(){const d=game.contentDocument,win=game.contentWindow,api=win.cubeSalvoQA;if(!api)throw new Error('Game API not initialized');
 const g=api.checkGeometry();check('body no horizontal overflow',d.documentElement.scrollWidth<=w,`${d.documentElement.scrollWidth} <= ${w}`);check('body no vertical overflow',d.documentElement.scrollHeight<=h,`${d.documentElement.scrollHeight} <= ${h}`);
 for(const [id,r]of Object.entries(g))check(id+' stays inside viewport',r.x>=-1&&r.y>=-1&&r.right<=w+1&&r.bottom<=h+1,JSON.stringify(r));
 const buttons=[d.getElementById('menu-button'),...d.querySelectorAll('.queue-button')];for(const b of buttons){const r=b.getBoundingClientRect();check((b.id||b.getAttribute('aria-label'))+' 44px target',r.width>=43.9&&r.height>=43.9,`${r.width}×${r.height}`);}
 check('sculpture canvas has usable space',g['game-canvas'].width>=180&&g['game-canvas'].height>=140,JSON.stringify(g['game-canvas']));
 const controls=d.getElementById('controls').getBoundingClientRect(),stage=d.getElementById('stage').getBoundingClientRect();check('stage and controls do not overlap',stage.right<=controls.left+1||stage.bottom<=controls.top+1,JSON.stringify({stage:stage.toJSON(),controls:controls.toJSON()}));
 return {d,win,api};}
function output(){const failed=assertions.filter(x=>!x.passed);report.className=failed.length?'fail':'ok';report.textContent=JSON.stringify({viewport:[w,h],passed:assertions.length-failed.length,total:assertions.length,failures:failed,checks:assertions},null,2);document.body.dataset.qa=failed.length?'failed':'passed';}
async function run(){assertions=[];try{const{d,win,api}=geometry();api.load(api.createGame(0));const colors=['green','pink','cyan','ink'],visible=api.exposedTargets(api.state),col=colors.indexOf(visible[0].color);d.querySelector('[data-column="'+col+'"]').click();await wait(400);check('queue click deploys and removes matching cubes',api.state.hits>0,api.state.hits+' hits');const beforePause=api.state.hits;d.getElementById('menu-button').click();await wait(240);check('menu opens and pauses simulation',d.getElementById('menu-dialog').open&&api.state.hits===beforePause);d.getElementById('restart-button').click();check('restart requires confirmation',d.getElementById('confirm-dialog').open);d.getElementById('confirm-cancel').click();check('cancel keeps current progress',api.state.hits===beforePause&&!d.getElementById('confirm-dialog').open);d.getElementById('levels-button').click();check('only unlocked levels selectable',d.querySelectorAll('#level-grid button:not(:disabled)').length===api.unlocked);d.getElementById('close-levels').click();check('closing levels returns to menu',d.getElementById('menu-dialog').open&&!d.getElementById('level-dialog').open);d.getElementById('resume-button').click();await wait(240);check('resume continues shooting',api.state.hits>beforePause&&!api.paused);win.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',key:' '}));const p=api.state.hits;await wait(180);check('Space pauses and shows resume card',api.paused&&d.getElementById('pause-card').hidden===false&&api.state.hits===p);d.getElementById('continue-game').click();check('resume card continues',!api.paused);d.getElementById('menu-button').click();d.getElementById('restart-button').click();d.getElementById('confirm-ok').click();check('confirmed restart resets level and closes dialogs',api.state.hits===0&&api.state.slots.every(x=>x===null)&&!d.querySelector('dialog[open]'));const saved=api.serialize(api.state);check('save restore retains exact state',api.serialize(api.restore(saved))===saved);
api.load(solve(api,7,.97));api.render();const chip=d.getElementById('level-label').getBoundingClientRect(),percent=d.getElementById('progress-label').getBoundingClientRect(),menu=d.getElementById('menu-button').getBoundingClientRect();check('late-level name and high percentage do not overlap',chip.right<=percent.left+1&&(percent.right<=menu.left+1||percent.top>=menu.bottom-1||percent.bottom<=menu.top+1),JSON.stringify({chip:chip.toJSON(),percent:percent.toJSON(),menu:menu.toJSON()}));
api.load(solve(api,0));await wait(100);check('real win dialog is displayed',d.getElementById('result-dialog').open&&d.getElementById('next-button').hidden===false);let rect=d.getElementById('result-dialog').getBoundingClientRect();check('win dialog stays in viewport',rect.x>=0&&rect.y>=0&&rect.right<=w+1&&rect.bottom<=h+1,JSON.stringify(rect.toJSON()));const nextRect=d.getElementById('next-button').getBoundingClientRect();check('win action visible and 44px high',nextRect.y>=0&&nextRect.bottom<=h+1&&nextRect.height>=44,JSON.stringify(nextRect.toJSON()));d.getElementById('next-button').click();check('next moves to second level',api.state.levelIndex===1&&api.state.hits===0);
const loss=api.createGame(6);for(let i=0;i<5;i++)api.deploy(loss,0);api.tick(loss,100);api.load(loss);await wait(100);check('real loss hides next and permits retry',d.getElementById('result-dialog').open&&d.getElementById('next-button').hidden===true);d.getElementById('retry-button').click();check('loss retry restarts correct level',api.state.levelIndex===6&&api.state.hits===0);
api.load(solve(api,11));await wait(100);check('final level has finite all-clear',d.getElementById('result-title').textContent.includes('12')&&d.getElementById('next-button').textContent==='从第一关再玩');d.getElementById('next-button').click();check('all-clear replay safely starts first level',api.state.levelIndex===0&&api.state.hits===0);geometry();}catch(e){check('test runner',false,e.stack||String(e));}output();}
document.getElementById('run').onclick=run;game.onload=async()=>{await wait(500);document.getElementById('scene').innerHTML=game.contentWindow.cubeSalvoQA.LEVELS.map((l,i)=>`<option value="${i}">${i+1} ${l.name}</option>`).join('');assertions=[];try{geometry();}catch(e){check('startup',false,e.stack||String(e));}output();if(params.get('auto')==='1')run();};
</script></html>
