<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暗标拍卖局 · 窄屏验收</title><style>*{box-sizing:border-box}body{background:#34393d;color:white;margin:0;padding:12px;font:14px system-ui}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 12px}button{padding:10px 16px;cursor:pointer}iframe{display:block;background:#0e191e;border:0;width:390px;height:920px;max-width:100%;margin:auto;box-shadow:0 0 0 1px #777}#report{white-space:pre-wrap;max-width:850px;margin:10px auto;font:12px monospace}</style></head><body><nav><strong>真实 CSS 窄屏测试</strong><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="410">410 px</button><button id="audit">检查布局</button><span id="size">390 px</span></nav><iframe id="frame" src="../index.html" title="游戏窄屏预览"></iframe><pre id="report"></pre><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelector('#size').textContent=button.dataset.width+' px';document.querySelector('#report').textContent=''}));document.querySelector('#audit').addEventListener('click',()=>{const d=frame.contentDocument,w=frame.contentWindow;const overflow=[...d.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect(),s=w.getComputedStyle(el);return s.position!=='fixed'&&s.display!=='none'&&r.width>0&&(r.right>w.innerWidth+1||r.left< -1)}).map(el=>({tag:el.tagName,class:el.className}));document.querySelector('#report').textContent=JSON.stringify({width:w.innerWidth,documentWidth:d.documentElement.scrollWidth,bodyWidth:d.body.scrollWidth,gridColumns:d.querySelector('.game-layout')?w.getComputedStyle(d.querySelector('.game-layout')).gridTemplateColumns:null,overflow},null,2)});
</script></body></html>
