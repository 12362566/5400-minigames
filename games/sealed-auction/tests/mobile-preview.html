<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>暗标拍卖局 · 单屏布局验收</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: #eff4f2; background: #263137; font: 14px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { max-width: 1040px; color: #c1cdd0; margin: 8px 0 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    button { min-height: 44px; padding: 8px 14px; border: 1px solid #75888e; border-radius: 6px; background: #36484f; color: #fff; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #e9d588; background: #5b5332; }
    #audit { background: #1d725b; border-color: #6cb9a4; }
    #size { font-variant-numeric: tabular-nums; }
    .viewport-stage { width: max-content; min-width: 100%; padding: 2px; }
    /* Intentionally no max-width or transform: these are actual CSS viewport sizes. */
    iframe { display: block; border: 0; background: #0e191e; width: 390px; height: 844px; box-shadow: 0 0 0 1px #9dafb5; }
    #summary { display: block; margin-top: 16px; font-size: 16px; font-weight: 700; }
    #report { margin-top: 8px; max-width: 1320px; max-height: 700px; overflow: auto; background: #18252a; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>真实视口 · 单屏布局验收</h1>
  <p>请在内嵌游戏里入场，关闭欢迎抽屉，再检查布局。切换尺寸保留当前游戏。外层验收页可以滚动，游戏主文档不能滚动。390 × 480 仅模拟软键盘压缩后的可用高度；真实手机还需检查键盘、地址栏和安全区。</p>
  <nav id="presets" aria-label="测试视口尺寸"></nav>
  <nav><button id="audit">检查布局</button><span id="size">390 × 844 CSS px</span><span id="load-status" role="status">正在载入游戏…</span></nav>
  <div class="viewport-stage"><iframe id="frame" src="../index.html?v=1.1.0" title="实际尺寸游戏预览：390 × 844 CSS 像素" width="390" height="844"></iframe></div>
  <output id="summary" aria-live="polite">尚未检查</output>
  <pre id="report" tabindex="0" aria-label="布局检查详细结果"></pre>
  <script type="module">
    import {auditWindow, viewportPresets} from './layout-audit.mjs';
    const frame = document.querySelector('#frame');
    const report = document.querySelector('#report');
    const summary = document.querySelector('#summary');
    let selected = viewportPresets[1];
    const presets = document.querySelector('#presets');
    for (const preset of viewportPresets) {
      const button = document.createElement('button');
      button.textContent = preset.label;
      button.dataset.width = preset.width;
      button.dataset.height = preset.height;
      button.setAttribute('aria-pressed', String(preset === selected));
      button.addEventListener('click', () => {
        selected = preset;
        frame.style.width = `${preset.width}px`;
        frame.style.height = `${preset.height}px`;
        frame.width = preset.width;
        frame.height = preset.height;
        frame.title = `实际尺寸游戏预览：${preset.width} × ${preset.height} CSS 像素`;
        document.querySelector('#size').textContent = `${preset.width} × ${preset.height} CSS px`;
        for (const option of presets.querySelectorAll('button')) option.setAttribute('aria-pressed', String(option === button));
        summary.textContent = '尺寸已切换；请检查当前布局';
        report.textContent = '';
      });
      presets.append(button);
    }
    function audit() {
      try {
        const result = auditWindow(frame.contentWindow, {width: selected.width, height: selected.height});
        window.lastLayoutAudit = result;
        summary.textContent = `${result.status} · ${result.actualViewport.innerWidth} × ${result.actualViewport.innerHeight} · ${result.issues.length} 个问题`;
        summary.style.color = result.status === 'PASS' ? '#8ce0ac' : result.status === 'FAIL' ? '#ffb39c' : '#ead99f';
        report.textContent = JSON.stringify(result, null, 2);
        return result;
      } catch (error) {
        summary.textContent = '检查未完成';
        report.textContent = `需要通过 HTTP/HTTPS 同源静态站点打开验收页与游戏。\n${error.name}: ${error.message}`;
        return null;
      }
    }
    // Exposed by the authored fixture for repeatable manual browser QA, not by the game.
    window.auditLayout = audit;
    document.querySelector('#audit').addEventListener('click', audit);
    frame.addEventListener('load', () => { document.querySelector('#load-status').textContent = '游戏已载入'; });
  </script>
</body>
</html>
